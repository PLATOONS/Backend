server:
  port:8080
  
spring:
  application:
    name: e-commerce
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 15MB
  flyway:
    enabled: true
    validate-on-migrate: true
    target: ${FLYWAY_TARGET:latest}
management:
  datadog:
    metrics:
      export:
        api-key: ${DD_API_KEY}
        application-key: ${DD_APP_KEY}
        uri: https://us5.datadog.com
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
