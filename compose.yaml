# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    env_file:
      - .env
    environment:
      - SECRET=${JWT_SECRET?Variable not set}
      # Was the change of name for these really necessary?
      - DB_PASSWORD=${DATABASE_PASSWORD?Variable not set}
      - DB_USERNAME=${DATABASE_USER:-user}
      - DB_NAME=${DATABASE_NAME:-e-commerce}
      - DB_HOST=db
      - DB_PORT=3306
      - FLYWAY_TARGET=${FLYWAY_TARGET:-latest}
      - DD_API_KEY=${DD_API_KEY:-key}
      - DD_APP_KEY={DD_APP_KEY:-key}
      - DD_AGENT_HOST=host.docker.internal
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:-key}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-key}
      - AWS_REGION=${AWS_REGION:-key}
      - S3_IMAGE_BUCKET_NAME=${S3_IMAGE_BUCKET_NAME:-key}
    ports:
      - ${BACKEND_PORT:-8080}:8080
    develop:
      watch:
        - path: .
          action: rebuild
        - path: ./src
          action: sync
          target: /build/src
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:oraclelinux9
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD?Variable not set}
      - MYSQL_ALLOW_EMPTY_PASSWORD=no
      - MYSQL_USER=${DATABASE_USER:-user}
      - MYSQL_DATABASE=${DATABASE_NAME:-e-commerce}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD?Variable not set}
    ports:
      - ${DATABASE_PORT:-3306}:3306
    volumes:
      - app-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10
volumes:
  app-data: